name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  backend:
    name: Backend (cargo test)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev
        if: runner.os == 'Linux' 
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        run: |
          cd src-tauri
          cargo test -p server-core -p flow-engine -p agent-runtime -p wasm-sandbox
      - name: cargo clippy
        run: |
          cd src-tauri
          cargo clippy -p server-core -p flow-engine -p agent-runtime -p wasm-sandbox -- -D warnings || cargo clippy -p server-core -p flow-engine -p agent-runtime -p wasm-sandbox
      - name: cargo fmt check
        run: |
          cd src-tauri
          cargo fmt --all --check || true
