[workspace]
members = ["crates/server-core", "crates/flow-engine", "crates/agent-runtime", "crates/wasm-sandbox"]

[workspace.dependencies]
# Embedded inference engine: the mofa-engine workspace's library crates
# (mofa-kernel traits + mofa-engine-core Engine facade) linked in-process.
# Pinned to our integration branch that aggregates upstream PRs #12/#14/#15/
# #16 plus the blocking-response reasoning field; re-point at
# https://github.com/mofa-org/mofa-engine once those merge upstream.
mofa-kernel = { git = "https://github.com/amos-aios/mofa-engine", rev = "1a6deef6d07240880a1035132b8c38c8021c52a6" }
mofa-engine-core = { git = "https://github.com/amos-aios/mofa-engine", rev = "1a6deef6d07240880a1035132b8c38c8021c52a6" }

[package]
name = "mofa-studio"
version = "0.1.0"
description = "A Tauri App"
authors = ["AmosLi"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mofa_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
server-core = { path = "crates/server-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "dwmapi"] }
