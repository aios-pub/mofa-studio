[package]
name = "agent-runtime"
version = "0.1.0"
description = "Task state machine: event-sourced steps with resume, per PRD TASK-04/08"
edition = "2021"

[lib]
name = "agent_runtime"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
