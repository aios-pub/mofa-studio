[package]
name = "flow-engine"
version = "0.1.0"
description = "Creation-workflow execution engine: topological scheduling, signature-cache incremental execution, queue"
edition = "2021"

[lib]
name = "flow_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
axum = "0.8"
