[package]
name = "wasm-sandbox"
version = "0.1.0"
description = "FLOW-11: capability-minimal WASM plugin sandbox — pure-compute modules, no WASI (no host file/network access by construction)"
edition = "2021"

[lib]
name = "wasm_sandbox"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "2"
wasmtime = { version = "27", default-features = false, features = ["cranelift", "wat", "runtime"] }
